name: Documentation

on:
  push:
    branches:
      - master
    paths:
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
      - "PublicDocs/**"
      - "addons/**/*.cs"
      - "addons/**/USAGE.md"
      - "GoDoFramework.csproj"
      - "Verification/ApiCompatibility/**"
  pull_request:
    branches:
      - master
    paths:
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
      - "PublicDocs/**"
      - "addons/**/*.cs"
      - "addons/**/USAGE.md"
      - "GoDoFramework.csproj"
      - "Verification/ApiCompatibility/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout G.U.I.D.E-CSharp v0.5.7
        uses: actions/checkout@v4
        with:
          repository: Phlegmlee/G.U.I.D.E-CSharp
          ref: 8a62ec422e4537d9b4a32d7abc3f19e0004c2fcf
          path: .third-party/guide
          persist-credentials: false

      - name: Checkout Phantom Camera v0.11.0.4
        uses: actions/checkout@v4
        with:
          repository: ramokz/phantom-camera
          ref: d20277eb0f9f7f0068e7aed7d7fe777ab72a0f07
          path: .third-party/phantom-camera
          persist-credentials: false

      - name: Install documentation integration dependencies
        shell: bash
        run: |
          cp -R .third-party/guide/addons/guideCS addons/guideCS
          cp -R .third-party/phantom-camera/addons/phantom_camera addons/phantom_camera

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and check documentation
        run: python PublicDocs/build_docs.py check

      - name: Verify public API compatibility
        run: python Verification/ApiCompatibility/api_compatibility.py check

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .artifacts/docs/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
